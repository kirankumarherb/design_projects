# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: PR checks
on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
jobs:
  # Checking if the PR is a `release-please` PR
  check-pr-type:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      is-release-pr: ${{ contains(github.head_ref, 'release-please--') }}
    steps:
      - run: echo "Checking PR type"

  # Required checks
  pr-checks:
    runs-on: ubuntu-latest
    needs: check-pr-type
    permissions:
      security-events: write
      packages: read
      contents: read
      pull-requests: read
      actions: read
    steps:
      - name: Skip detailed checks for release-please PR
        if: ${{ needs.check-pr-type.outputs.is-release-pr == 'true' }}
        run: |
          echo "This is an automated release PR created by release-please."
          echo "Skipping validation checks as these are automated changes."
          echo "${{ needs.check-pr-type.outputs.is-release-pr }}"
          echo "${{ github.head_ref }}"

      - name: Validate PR title
        if: ${{ needs.check-pr-type.outputs.is-release-pr == 'false' }}
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate PR commits
        if: ${{ needs.check-pr-type.outputs.is-release-pr == 'false' }}
        uses: wagoid/commitlint-github-action@v6
        with:
          configFile: .commitlintrc.json

      - name: Checkout code
        if: ${{ needs.check-pr-type.outputs.is-release-pr == 'false' }}
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup moon
        if: ${{ needs.check-pr-type.outputs.is-release-pr == 'false' }}
        uses: moonrepo/setup-toolchain@v0
